[[redirects]]
  from = "/telecharger/str-chaussee"
  to = "/logiciels/str-chaussee/logiciel.zip"
  status = 200

[[redirects]]
  from = "/telecharger/oh-route"
  to = "/logiciels/oh-route/logiciel.zip"
  status = 200

# Configuration pour forcer le téléchargement des fichiers .exe et .zip
[[headers]]
  for = "/logiciels/*"
  [headers.values]
    Content-Disposition = "attachment"
    Cache-Control = "public, max-age=31536000, immutable"

# Headers de sécurité de base
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "no-referrer-when-downgrade"
